# ===================================================================
# GARUDA AERO GCS - DRONE MISSION PLANNING & AIRSPACE SAFETY
# Spring Boot 3 & MySQL Configuration
# ===================================================================

spring.application.name=garuda-aero-gcs
server.port=8080

# MySQL Database Connection (configure via DB_PASSWORD env var or set local password)
spring.datasource.url=jdbc:mysql://localhost:3306/drone_simulation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable Scheduled Tasks for Real-time Simulation Engine
spring.task.scheduling.pool.size=4

# Jackson JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC